<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Application d'aide à l'arrêt du tabac fondée sur les études Cochrane.">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Arrête">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cap Zéro Cigarette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,500..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout : une colonne lisible (720px max), barre d'onglets en bas, bouton « Envie de fumer » toujours à portée de pouce. */
:root{
  --bg:#eef3f1;          /* air frais, gris-vert très clair */
  --surface:#ffffff;
  --sunk:#e1e9e6;
  --ink:#15241f;
  --muted:#4f625b;
  --line:#c9d6d1;
  --air:#0b7a62;         /* accent : oxygène */
  --air-soft:#d3ece4;
  --ember:#b4471b;       /* braise : rechute, alertes */
  --ember-soft:#f6e1d6;
  --ok:#1f7a3a;
  --sos:#163a4a;         /* bleu nuit apaisant pour l'aide immédiate */
  --sos-ink:#ffffff;
  --band:#ffffff;--band-ink:#15241f;--band-muted:#4f625b;--band-faint:#dde6e2;--band-accent:#d2551e; /* bandeau blanc ; le point final = braise éteinte */
  --display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1715;--surface:#17221f;--sunk:#1f2c28;--ink:#e6efeb;--muted:#9fb3ab;--line:#2e3f3a;
  --air:#4cc7a4;--air-soft:#173a31;--ember:#ef8a5d;--ember-soft:#3a2219;--ok:#6fd38c;--sos:#2f6d86;--sos-ink:#ffffff;
  --band:#ffffff;--band-ink:#15241f;--band-muted:#4f625b;--band-faint:#dde6e2;--band-accent:#d2551e;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1715;--surface:#17221f;--sunk:#1f2c28;--ink:#e6efeb;--muted:#9fb3ab;--line:#2e3f3a;
  --air:#4cc7a4;--air-soft:#173a31;--ember:#ef8a5d;--ember-soft:#3a2219;--ok:#6fd38c;--sos:#2f6d86;--sos-ink:#ffffff;
  --band:#ffffff;--band-ink:#15241f;--band-muted:#4f625b;--band-faint:#dde6e2;--band-accent:#d2551e;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-block:0 calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--band)}
.wrap{max-width:752px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#view{padding-block:24px 0}
h1,h2,h3{font-family:var(--display);font-stretch:85%;line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.9rem;font-weight:800}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1.08rem;font-weight:700}
p{margin:0}
a{color:var(--air);text-underline-offset:3px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-stretch:90%}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.eyebrow{font-family:var(--display);font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:26px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* Bandeau « ARRÊTE. » */
.band{background:var(--band);color:var(--band-ink);overflow:hidden;border-bottom:1px solid var(--line)}
.band .in{max-width:752px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 26px;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brandrow .mark{font-family:var(--display);font-weight:800;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--band-muted)}
.sync{font-size:.8rem;color:var(--band-muted)}
.stopword{display:inline-block;align-self:flex-start;font-family:var(--display);font-weight:900;font-stretch:72%;font-size:clamp(5rem,24vw,11.5rem);line-height:.8;letter-spacing:-.012em;margin:8px 0 2px;white-space:nowrap;
  animation:settle 1.1s cubic-bezier(.2,.7,.2,1) both}
.stopword .ember{color:var(--band-accent)}
@keyframes settle{from{letter-spacing:.09em}to{letter-spacing:-.012em}}
@media (prefers-reduced-motion:reduce){.stopword{animation:none}}
.tagline{font-size:1.1rem;color:var(--band-ink);max-width:34ch}
.tagline em{font-style:normal;color:var(--band-muted)}
.bandstatus{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--band-faint);padding-top:14px;margin-top:4px}
.bandstatus .line{font-family:var(--display);font-stretch:85%;font-weight:750;font-size:1.25rem;font-variant-numeric:tabular-nums}
.bandstatus .line b{color:var(--band-accent);font-weight:800}
.sticks{display:flex;flex-wrap:wrap;gap:5px}
.sticks i{width:9px;height:30px;border-radius:2px 2px 3px 3px;background:var(--band-faint)}
.sticks i.on{background:var(--band-ink)}
.sticks-l{font-size:.88rem;color:var(--band-muted)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card.flat{background:transparent;border:none;padding:0}
.card.air{background:var(--air-soft);border-color:transparent}
.card.ember{background:var(--ember-soft);border-color:transparent}
.hero{padding:22px 20px}
.big{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.01em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-size:1.55rem;font-weight:800}
.stat .l{font-size:.82rem;color:var(--muted);line-height:1.3}
@media (max-width:460px){.stats{grid-template-columns:1fr 1fr}.stats .stat:last-child{grid-column:1/-1}.big{font-size:2.8rem}}

button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700}
.btn.primary{background:var(--air);border-color:var(--air);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#062a20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#062a20}}
.btn.ember{border-color:var(--ember);color:var(--ember);background:transparent}
.btn.block{width:100%}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--air);outline-offset:2px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;min-height:44px;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--air);border-color:var(--air);color:#fff}
:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#062a20}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#062a20}}

label.f{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;min-height:48px;width:100%}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:460px){.grid2{grid-template-columns:1fr}}

.progress{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--air);border-radius:99px}

/* Échelle de temps santé */
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.timeline li{display:grid;grid-template-columns:92px 22px 1fr;gap:10px;align-items:start;padding-block:10px;border-bottom:1px dashed var(--line)}
.timeline li:last-child{border-bottom:none}
.timeline .when{font-family:var(--display);font-weight:750;font-stretch:85%;font-variant-numeric:tabular-nums;color:var(--muted)}
.timeline .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);margin-top:4px;background:var(--surface)}
.timeline li.done .dot{background:var(--air);border-color:var(--air)}
.timeline li.done .when{color:var(--air)}
.timeline li.next{background:var(--air-soft);border-radius:10px;padding-inline:8px;margin-inline:-8px}
.timeline .src{font-size:.78rem;color:var(--muted)}

/* Cartes de traitement */
.method{display:flex;flex-direction:column;gap:10px}
.method.chosen{border:2px solid var(--air)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.tag.air{background:var(--air-soft);color:var(--air)}
.tag.ember{background:var(--ember-soft);color:var(--ember)}
.meter{display:flex;align-items:center;gap:10px;font-size:.9rem}
.meter .bar{flex:1;height:8px;background:var(--sunk);border-radius:99px;position:relative;min-width:0}
.meter .bar i{position:absolute;top:0;bottom:0;background:var(--air);border-radius:99px;opacity:.85}
ul.clean{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:700;color:var(--air);min-height:32px}

.check{display:flex;gap:12px;align-items:flex-start;padding-block:8px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:none}
.check input{width:24px;height:24px;min-height:24px;margin-top:2px;flex:none;accent-color:var(--air)}

/* Plan si-alors */
.ifthen{display:flex;flex-direction:column;gap:8px;padding-block:12px;border-bottom:1px solid var(--line)}
.ifthen:last-child{border-bottom:none}
.ifthen .if{font-weight:700}

/* Graphique des envies */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}

/* Barre d'onglets + bouton SOS */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.dock .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{background:none;border:none;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.82rem;color:var(--muted);min-height:58px;font-weight:700}
.tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--air)}
.sosbtn{position:fixed;z-index:21;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));
  background:var(--sos);color:var(--sos-ink);border:none;border-radius:999px;padding:14px 26px;min-height:56px;font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:.01em;
  box-shadow:0 6px 18px rgba(10,30,40,.28);display:flex;align-items:center;gap:10px;white-space:nowrap}
.sosbtn .pulse{width:12px;height:12px;border-radius:50%;background:#7fe3c4}

/* Panneau SOS */
.overlay{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.overlay .wrap{padding-inline:0;display:flex;flex-direction:column;gap:18px}
.breath{display:flex;flex-direction:column;align-items:center;gap:14px;padding-block:10px}
.ring{position:relative;width:220px;height:220px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.ring .time .num{font-size:2.6rem;font-weight:800}
.lung{position:absolute;inset:38px;border-radius:50%;background:var(--air-soft);transform:scale(.72);transition:transform 4s ease-in-out}
.lung.in{transform:scale(1);transition-duration:4s}
.lung.out{transform:scale(.72);transition-duration:6s}
@media (prefers-reduced-motion:reduce){.lung,.lung.in,.lung.out{transition:none}}
.cue{font-family:var(--display);font-weight:750;font-size:1.25rem;color:var(--air);min-height:1.6em}
.reasonlist{display:flex;flex-wrap:wrap;gap:8px}
.reasonlist span{background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:700;font-size:.95rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;max-width:calc(100% - 32px)}
.phone{font-family:var(--display);font-size:1.8rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.02em;user-select:all}
.srcs li{font-size:.92rem}
.srcs li span{color:var(--muted)}
</style>

</head>
<body>
<header class="band">
  <div class="in">
    <div class="brandrow"><span class="mark">Cap Zéro Cigarette</span><span class="sync" id="sync">Chargement…</span></div>
    <h1 class="stopword" aria-label="Arrête.">ARRÊTE<span class="ember">.</span></h1>
    <p class="tagline">Pour de bon. <em>Pas juste une pause.</em></p>
    <div class="bandstatus" id="bandStatus"></div>
  </div>
</header>
<div class="wrap">
  <main id="view" aria-live="polite"></main>
</div>

<button class="sosbtn" id="sosOpen" type="button" aria-haspopup="dialog"><span class="pulse" aria-hidden="true"></span>J'ai envie de fumer</button>

<nav class="dock" aria-label="Sections">
  <div class="in">
    <button class="tab" data-tab="today" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Aujourd'hui</button>
    <button class="tab" data-tab="plan" type="button"><svg viewBox="0 0 24 24"><path d="M9 4h6M8 4H6a1 1 0 0 0-1 1v15a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1h-2"/><path d="m9 13 2 2 4-4"/></svg>Mon plan</button>
    <button class="tab" data-tab="health" type="button"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Ma santé</button>
    <button class="tab" data-tab="help" type="button"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a1 1 0 0 1-1 1A16 16 0 0 1 4 5a1 1 0 0 1 1-1"/></svg>Aide</button>
  </div>
</nav>

<div class="overlay" id="sos" role="dialog" aria-modal="true" aria-labelledby="sosTitle" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(() => {
"use strict";
/* ---------- Données de référence (sources dans l'onglet Aide) ---------- */
const MIN = 60e3, HOUR = 36e5, DAY = 864e5;

const MILESTONES = [
  {t:20*MIN, w:"20 min", txt:"Le pouls et la tension artérielle redescendent.", src:"OMS"},
  {t:12*HOUR, w:"12 h", txt:"Le monoxyde de carbone dans le sang revient à un niveau normal. Le sang transporte mieux l'oxygène.", src:"OMS"},
  {t:2*DAY, w:"48 h", txt:"Le goût et l'odorat commencent à revenir.", src:"HSE Irlande"},
  {t:3*DAY, w:"3 jours", txt:"La nicotine a quitté le corps. Les bronches se relâchent, respirer devient plus facile. C'est souvent le pic du manque : il va maintenant baisser.", src:"HSE Irlande"},
  {t:14*DAY, w:"2 sem.", txt:"Pour la plupart des gens, irritabilité, nervosité et troubles du sommeil ont nettement diminué.", src:"Univ. of Michigan, Healthline"},
  {t:28*DAY, w:"4 sem.", txt:"La plupart des symptômes de manque ont disparu. Les envies restent possibles mais plus rares.", src:"West & Hajek"},
  {t:84*DAY, w:"12 sem.", txt:"Entre 2 et 12 semaines : circulation et fonction pulmonaire s'améliorent. Marcher et monter les escaliers deviennent plus faciles.", src:"OMS"},
  {t:274*DAY, w:"9 mois", txt:"Entre 1 et 9 mois : la toux et l'essoufflement diminuent.", src:"OMS"},
  {t:365*DAY, w:"1 an", txt:"Le risque supplémentaire de maladie coronarienne est réduit de moitié par rapport à un fumeur.", src:"OMS"},
  {t:3*365*DAY, w:"3 ans", txt:"Environ la moitié du gain d'espérance de vie lié à l'arrêt est déjà acquise.", src:"Cho et al., NEJM Evidence 2024"},
  {t:5*365*DAY, w:"5 ans", txt:"Entre 5 et 15 ans : le risque d'AVC rejoint celui d'un non-fumeur.", src:"OMS"},
  {t:10*365*DAY, w:"10 ans", txt:"Le risque de mourir d'un cancer du poumon est environ la moitié de celui d'un fumeur. La survie se rapproche de celle d'un non-fumeur.", src:"OMS ; Cho et al. 2024"},
  {t:15*365*DAY, w:"15 ans", txt:"Le risque de maladie coronarienne est celui d'un non-fumeur.", src:"OMS"}
];

const TRIGGERS = [
  {id:"cafe", label:"Café du matin", plan:"je bois mon café à un autre endroit (pas sur le balcon) et je prends une gomme ou je bois un grand verre d'eau d'abord"},
  {id:"repas", label:"Après le repas", plan:"je me lève tout de suite de table, je me brosse les dents ou je fais 10 minutes de marche"},
  {id:"pause", label:"Pause au travail", plan:"je pars marcher 5 minutes dans une autre direction que les fumeurs, ou je prends un fruit"},
  {id:"voiture", label:"En voiture", plan:"je vide la voiture de tout ce qui touche au tabac, je garde des chewing-gums à portée de main et je mets une émission ou un podcast"},
  {id:"stress", label:"Stress, énervement", plan:"je fais 1 minute de respiration lente (inspirer 4 s, souffler 6 s) puis je marche"},
  {id:"alcool", label:"Apéro, alcool", plan:"je limite à un verre les 4 premières semaines, je reste avec des non-fumeurs et je refuse d'avance : « Non merci, j'ai arrêté »"},
  {id:"ennui", label:"Ennui, temps mort", plan:"j'occupe mes mains (téléphone, stylo, bricolage) et j'ouvre ce bouton « J'ai envie de fumer »"},
  {id:"fumeurs", label:"Avec des fumeurs", plan:"je préviens que j'arrête et je m'éloigne quand ils sortent fumer"},
  {id:"telephone", label:"Au téléphone", plan:"je téléphone debout en marchant, sans briquet dans les poches"}
];

const REASONS = ["Voir grandir mes enfants / petits-enfants","Ma santé, mon cœur","Retrouver du souffle","L'argent économisé","Ma vie sexuelle","Ne plus sentir le tabac","Donner l'exemple","Être libre, ne plus dépendre","Mon couple","Le sport, la forme"];

const METHODS = {
  varenicline:{
    name:"Varénicline", tag:"Sur ordonnance", per100:"12 à 16 sur 100", lo:12, hi:16,
    pitch:"Le médicament le plus étudié. Il réduit l'envie et le plaisir de fumer.",
    how:["Demandez une ordonnance à votre médecin.","Commencez en général 1 semaine avant le jour J ; le médecin augmente la dose progressivement.","Durée standard : 12 semaines. Prolonger de 12 semaines aide à éviter la rechute.","Effets fréquents : nausées (le prendre en mangeant, avec un grand verre d'eau), rêves intenses."],
    cost:"En Suisse, un générique existe depuis février 2026. Il n'est en général pas remboursé ; la caisse décide au cas par cas.",
    weeksBefore:1
  },
  nrt:{
    name:"Patch + gommes (substituts combinés)", tag:"En pharmacie, sans ordonnance", per100:"proche de la varénicline", lo:0, hi:0, estimate:true,
    pitch:"Un patch pour le fond de nicotine, plus une forme rapide (gomme, pastille, spray) pour chaque envie. Deux produits ensemble marchent mieux qu'un seul.",
    how:["À 17 cigarettes par jour : patch fort (21 mg/24 h, ou 14 mg selon le pharmacien) + gommes ou pastilles 2 mg à chaque envie.","Option qui augmente les chances : coller le patch 2 à 4 semaines avant le jour J, en continuant de fumer normalement.","Gardez le traitement 8 à 12 semaines, puis baissez progressivement.","Sous-dosage fréquent : si l'envie reste forte, parlez au pharmacien pour augmenter la dose."],
    cost:"Non remboursé par l'assurance de base. Coût en général inférieur à ce que coûtent les cigarettes sur la même période.",
    weeksBefore:4
  },
  ecig:{
    name:"Cigarette électronique avec nicotine", tag:"Libre", per100:"10 à 19 sur 100", lo:10, hi:19,

const DEFAULTS = () => ({v:1, age:46, perDay:17, years:23, price:9.5, quitAt:null, method:null, reasons:[], plans:{}, custom:"", cravings:[], lapses:[], checklist:{}, createdAt:Date.now()});

/* ---------- Stockage : base privée Claude si disponible, sinon ce navigateur ---------- */
const LS_KEY = "capzero.v1";
let S = DEFAULTS();
let docRef = null, saving = Promise.resolve(), saveTimer = null, mode = "local";

function lsRead(){ try{ const s = localStorage.getItem(LS_KEY); return s ? JSON.parse(s) : null; }catch(e){ return null; } }
function lsWrite(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }
function merge(obj){ return Object.assign(DEFAULTS(), obj || {}); }

function save(){
  lsWrite();
  if(!docRef) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    const body = {state: JSON.parse(JSON.stringify(S)), updatedAt: Date.now()};
    saving = saving.then(() => docRef.set(body)).then(() => setSync("Enregistré sur votre compte Claude")).catch(() => setSync("Enregistré sur cet appareil"));
  }, 500);
}
function setSync(t){ document.getElementById("sync").textContent = t; }

async function initStore(){
  const local = lsRead();
  if(local) S = merge(local);
  setSync("Enregistré sur cet appareil");
  render();
  try{
    if(!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if(!db || !user) return;
    const uid = await user.id();
    if(!uid) return;
    docRef = db.doc("data/users/" + uid + "/plan");
    const snap = await docRef.get();
    if(snap.exists && snap.data() && snap.data().state){
      const remote = snap.data().state;
      const localTime = local && local.lastEdit || 0, remoteTime = remote.lastEdit || 0;
      S = merge(remoteTime >= localTime ? remote : local);
      lsWrite();
    } else if(local){
      save();
    }
    mode = "account";
    setSync("Enregistré sur votre compte Claude");
    render();
  }catch(e){ docRef = null; }
}
function commit(){ S.lastEdit = Date.now(); save(); render(); }

/* ---------- Calculs ---------- */
const now = () => Date.now();
const cigPrice = () => (Number(S.price)||0) / 20;
function lastLapse(){ return S.lapses.length ? Math.max(...S.lapses.map(l => l.t)) : 0; }
function sinceStart(){ return S.quitAt ? now() - S.quitAt : -1; }
function cleanStart(){ return S.quitAt ? Math.max(S.quitAt, lastLapse()) : null; }
function cleanMs(){ const c = cleanStart(); return c ? Math.max(0, now() - c) : 0; }
function notSmoked(){ const ms = sinceStart(); if(ms <= 0) return 0; return Math.max(0, Math.floor(ms / DAY * S.perDay) - S.lapses.reduce((a,l)=>a+(l.n||1),0)); }
function packYears(){ return S.perDay / 20 * S.years; }
function lifetimeCigs(){ return Math.round(S.perDay * 365.25 * S.years); }
const fmtCHF = n => n.toLocaleString("fr-CH", {minimumFractionDigits: n < 100 ? 2 : 0, maximumFractionDigits: n < 100 ? 2 : 0});
const fmtInt = n => Math.round(n).toLocaleString("fr-CH");
const dateFR = d => new Date(d).toLocaleDateString("fr-CH", {weekday:"long", day:"numeric", month:"long"});
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function dur(ms){
  const d = Math.floor(ms/DAY), h = Math.floor(ms%DAY/HOUR), m = Math.floor(ms%HOUR/MIN);
  if(d >= 1) return {big:d, unit: d===1?"jour":"jours", sub:`${h} h ${String(m).padStart(2,"0")} min`};
  if(h >= 1) return {big:h, unit:"h", sub:`${m} min`};
  return {big:m, unit:"min", sub:"Chaque minute compte"};
}
function phase(){
  if(!S.quitAt || now() < S.quitAt) return "prep";
  const d = cleanMs()/DAY;
  if(d < 7) return "w1"; if(d < 28) return "m1"; if(d < 90) return "m3"; if(d < 365) return "y1"; return "free";
}
const PHASES = {
  w1:{t:"Semaine 1 : la plus importante", b:"Règle d'or : <strong>pas une seule bouffée</strong>. Une étude a montré que la grande majorité de ceux qui refument pendant la première semaine fument de nouveau à 6 mois. Le manque est au plus fort les premiers jours, puis il baisse. Chaque envie dure quelques minutes : utilisez le bouton en bas."},
  m1:{t:"Semaines 2 à 4 : le manque recule", b:"Irritabilité, nervosité et sommeil s'améliorent en 2 à 4 semaines. Continuez votre traitement à pleine dose, même si vous vous sentez bien. Une marche de 5 à 15 minutes réduit l'envie pendant près de 50 minutes."},
  m3:{t:"Mois 2 et 3 : attention à la confiance", b:"Les pièges classiques : l'apéro, une fête, une mauvaise nouvelle, et l'idée « une seule, ça ne compte pas ». Terminez la durée complète du traitement. La prise de poids se fait surtout pendant ces 3 premiers mois : marchez chaque jour."},
  y1:{t:"Mois 4 à 12 : consolider", b:"Les envies sont rares mais peuvent surgir fort, parfois des mois après. C'est normal et ça passe. Si vous prenez de la varénicline, demandez au médecin de prolonger de 12 semaines : c'est ce qui aide le plus à éviter la rechute."},
  free:{t:"Plus d'un an : vous êtes un ancien fumeur", b:"Vos risques continuent de baisser chaque année. Restez vigilant face à la « seule cigarette » en soirée : c'est ainsi que la plupart des anciens fumeurs rechutent."}
};

/* ---------- Bandeau du haut ---------- */
function avoidedToday(){
  const c = cleanStart(); if(!c || now() < c) return 0;
  const wake = new Date().setHours(7,0,0,0), sleep = new Date().setHours(23,0,0,0);
  const from = Math.max(wake, c), to = Math.min(sleep, now());
  if(to <= from) return 0;
  return Math.min(S.perDay, Math.floor(S.perDay * (to - from) / (16*HOUR)));
}
function renderBand(){
  const el = document.getElementById("bandStatus"); if(!el) return;
  if(!S.quitAt){ el.innerHTML = `<p class="line">Première étape : choisir votre jour J.</p>`; return; }
  if(now() < S.quitAt){
    const days = Math.ceil((S.quitAt - now())/DAY);
    el.innerHTML = `<p class="line">Jour J ${esc(dateFR(S.quitAt))} · dans <b>${days} ${days===1?"jour":"jours"}</b></p>`;
    return;
  }
  const D = dur(cleanMs());
  const n = avoidedToday(), shown = Math.min(S.perDay, 40);
  const sticks = Array.from({length:shown}, (_,i) => `<i class="${i < n ? "on" : ""}"></i>`).join("");
  el.innerHTML = `<p class="line">Libre depuis <b>${D.big} ${D.unit}</b>${D.big && D.unit.startsWith("jour") ? ` <span class="sticks-l">${esc(D.sub)}</span>` : ""}</p>
    <div class="sticks" aria-hidden="true">${sticks}</div>
    <p class="sticks-l">Aujourd'hui : ${n} cigarette${n>1?"s":""} sur ${S.perDay} évitée${n>1?"s":""}</p>`;
}

function bindSetup(){

  };

function vCravingChart(){
  if(!S.cravings.length) return `<section class="card stack"><h3>Vos envies</h3><p class="muted">Chaque fois que vous utilisez le bouton « J'ai envie de fumer », l'envie est notée ici. Vous verrez qu'elles deviennent plus rares et plus faibles.</p></section>`;
  const days = 14, start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate()-days+1);
  const counts = Array.from({length:days}, (_,i) => { const a = start.getTime()+i*DAY, b = a+DAY; return S.cravings.filter(c => c.t>=a && c.t<b).length; });
  const max = Math.max(4, ...counts);
  const W = 340, H = 130, pl = 22, pb = 22, pt = 8, bw = (W-pl)/days;
  const ticks = [0, Math.round(max/2), max];
  let bars = "";
  counts.forEach((c,i) => { const h = c/max*(H-pb-pt); bars += `<rect x="${(pl+i*bw+2).toFixed(1)}" y="${(H-pb-h).toFixed(1)}" width="${(bw-4).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="var(--air)"><title>${c} envie(s)</title></rect>`; });
  const grid = ticks.map(t => { const y = H-pb-t/max*(H-pb-pt); return `<line x1="${pl}" x2="${W}" y1="${y.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-dasharray="${t?"3 3":"0"}"/><text x="${pl-5}" y="${(y+4).toFixed(1)}" text-anchor="end">${t}</text>`; }).join("");

  const trig = {}; S.cravings.forEach(c => (c.trig||[]).forEach(t => trig[t] = (trig[t]||0)+1));

  return `<section class="card stack chart">

    ${top.length ? `<p class="small"><strong>Vos situations les plus fréquentes :</strong> ${top.join(", ")}. Vérifiez que vous avez un plan « Si… alors… » pour chacune.</p>` : ""}
  </section>`;
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { tab = b.dataset.tab; render(); window.scrollTo({top:0}); }));

view.addEventListener("click", e => {
  const t = e.target.closest("button,input[type=checkbox]");
  if(!t) return;
  if(t.dataset.go){ tab = t.dataset.go; render(); window.scrollTo({top:0}); return; }
  if(t.dataset.check){ S.checklist[t.dataset.check] = t.checked; S.lastEdit = Date.now(); save(); setTimeout(render, 150); return; }
  if(t.dataset.method){ S.method = t.dataset.method; commit(); toast("Traitement enregistré"); return; }
  if(t.dataset.trig){ const id = t.dataset.trig; if(S.plans[id] !== undefined) delete S.plans[id]; else S.plans[id] = TRIGGERS.find(x=>x.id===id).plan; commit(); return; }
  if(t.dataset.reason2){ const r = t.dataset.reason2; S.reasons = S.reasons.includes(r) ? S.reasons.filter(x=>x!==r) : [...S.reasons, r]; commit(); return; }
  const a = t.dataset.act;
  if(a === "quitnow"){ S.quitAt = now(); commit(); toast("C'est parti. Pas une seule bouffée."); }
  if(a === "changedate"){ S.quitAt = null; S.lapses = []; tab = "today"; commit(); }
  if(a === "askreset"){ document.getElementById("resetZone").innerHTML = `<div class="stack"><p><strong>Effacer toutes vos données ?</strong> Jour J, envies, plans et raisons seront supprimés.</p><div class="row"><button class="btn ember" type="button" data-act="reset">Oui, tout effacer</button><button class="btn" type="button" data-act="noreset">Annuler</button></div></div>`; }
  if(a === "noreset") render();
  if(a === "reset"){ S = DEFAULTS(); tab = "today"; commit(); toast("Données effacées"); }
  if(a === "copyphone"){
    const txt = "0848000181";
    try{ navigator.clipboard.writeText(txt).then(() => toast("Numéro copié"), () => selectPhone()); }catch(err){ selectPhone(); }
  }
  if(a === "lapse1" || a === "lapseN") openLapse(a === "lapse1" ? 1 : 3);
});
view.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.plan){ S.plans[t.dataset.plan] = t.value; S.lastEdit = Date.now(); save(); }
  if(t.id === "fCustom"){ S.custom = t.value; S.lastEdit = Date.now(); save(); }
  if(t.id === "sPer"){ const v = +t.value; if(v > 0){ S.perDay = v; S.lastEdit = Date.now(); save(); } }
  if(t.id === "sAge"){ const v = +t.value; if(v >= 18){ S.age = v; S.lastEdit = Date.now(); save(); } }
  if(t.id === "sYears"){ const v = +t.value; if(v > 0){ S.years = v; S.lastEdit = Date.now(); save(); } }

const sos = document.getElementById("sos");
let sosTimer = null, breathTimer = null, sosEnd = 0, sosData = null;
const R = 100, CIRC = 2*Math.PI*R;

function openSOS(){
  sosData = {t: now(), trig: [], i: 3};
  const allReasons = [...S.reasons, ...(S.custom ? [S.custom] : [])];
  const m = S.method ? METHODS[S.method] : null;
  const fast = S.method === "nrt" ? "Prenez une gomme ou une pastille maintenant." : S.method === "ecig" ? "Prenez quelques bouffées de votre cigarette électronique." : null;
  sos.innerHTML = `<div class="wrap">
    <div class="row" style="justify-content:space-between"><p class="eyebrow">Envie de fumer</p><button class="btn" type="button" data-sos="close">Fermer</button></div>
    <h1 id="sosTitle">Elle va passer. Tenez 5 minutes.</h1>

    <div class="breath">

        <svg viewBox="0 0 220 220" aria-hidden="true"><circle cx="110" cy="110" r="${R}" stroke="var(--sunk)" stroke-width="10" fill="none"/><circle id="arc" cx="110" cy="110" r="${R}" stroke="var(--air)" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="0"/></svg>
        <div class="time"><span class="num" id="sosClock">5:00</span><span class="small muted">restantes</span></div>
      </div>
      <p class="cue" id="cue" aria-live="polite">Inspirez…</p>
    </div>
    ${allReasons.length ? `<section class="stack"><p class="eyebrow">Pourquoi vous faites ça</p><div class="reasonlist">${allReasons.map(r=>`<span>${esc(r)}</span>`).join("")}</div></section>` : ""}
    <section class="card stack">
      <h3>Pendant ce temps</h3>
      <ul class="clean">
        ${fast ? `<li><strong>${fast}</strong></li>` : ""}
        <li>Levez-vous et marchez 5 à 10 minutes, même dans l'appartement. L'effort réduit l'envie pendant de longues minutes.</li>
        <li>Buvez un grand verre d'eau froide.</li>
        <li>Changez de pièce ou d'activité : l'envie est liée au lieu.</li>
      </ul>
    </section>
    <section class="card stack">
      <h3>Qu'est-ce qui a déclenché l'envie ?</h3>
      <div class="row" id="sosTrig">${TRIGGERS.map(t=>`<button class="chip" type="button" data-strig="${t.id}" aria-pressed="false">${esc(t.label)}</button>`).join("")}</div>
      <div id="sosPlan"></div>
      <label class="f" for="sosInt">Force de l'envie : <span id="sosIntV" class="num">3</span> / 5<input id="sosInt" type="range" min="1" max="5" value="3" style="min-height:32px;padding:0;border:none;background:none"></label>
    </section>
    <div class="stack">
      <button class="btn primary block" type="button" data-sos="won">L'envie est passée, je n'ai pas fumé</button>
      <button class="btn ember block" type="button" data-sos="lost">J'ai fumé</button>
    </div>
  </div>`;
  sos.hidden = false;
  document.body.style.overflow = "hidden";
  sosEnd = now() + 5*MIN;
  tickSOS(); sosTimer = setInterval(tickSOS, 250);
  breathe();
  sos.querySelector('[data-sos="close"]').focus();
}
function tickSOS(){
  const left = Math.max(0, sosEnd - now());
  const s = Math.ceil(left/1000);
  const clock = document.getElementById("sosClock"); if(!clock) return;
  clock.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  document.getElementById("arc").setAttribute("stroke-dashoffset", (CIRC*(1-left/(5*MIN))).toFixed(1));
  if(left <= 0){ clearInterval(sosTimer); sosTimer = null; document.getElementById("cue").textContent = "5 minutes tenues. Bravo."; clearTimeout(breathTimer); }
}
function breathe(){
  const lung = document.getElementById("lung"), cue = document.getElementById("cue");
  if(!lung) return;
  const inhale = () => { if(!sosTimer) return; lung.className = "lung in"; cue.textContent = "Inspirez lentement par le nez… 4 s"; breathTimer = setTimeout(exhale, 4000); };
  const exhale = () => { if(!sosTimer) return; lung.className = "lung out"; cue.textContent = "Soufflez doucement par la bouche… 6 s"; breathTimer = setTimeout(inhale, 6000); };
  inhale();
}
function closeSOS(){ clearInterval(sosTimer); clearTimeout(breathTimer); sosTimer = null; sos.hidden = true; sos.innerHTML = ""; document.body.style.overflow = ""; document.getElementById("sosOpen").focus(); }

sos.addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.strig){
    const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
    const id = b.dataset.strig; sosData.trig = on ? [...sosData.trig, id] : sosData.trig.filter(x=>x!==id);
    const plans = sosData.trig.map(tid => { const t = TRIGGERS.find(x=>x.id===tid); const p = S.plans[tid] || t.plan; return `<p><strong>Votre plan, ${esc(t.label.toLowerCase())} :</strong> ${esc(p)}</p>`; }).join("");
    document.getElementById("sosPlan").innerHTML = plans ? `<div class="card air stack">${plans}</div>` : "";
    return;
  }
  const a = b.dataset.sos;
  if(a === "close") closeSOS();
  if(a === "won"){ logCraving(true); closeSOS(); toast("Envie surmontée. Une de moins."); render(); }
  if(a === "lost"){ logCraving(false); closeSOS(); openLapse(1); }
});
sos.addEventListener("input", e => { if(e.target.id === "sosInt"){ sosData.i = +e.target.value; document.getElementById("sosIntV").textContent = e.target.value; } });
document.addEventListener("keydown", e => { if(e.key === "Escape" && !sos.hidden) closeSOS(); });
document.getElementById("sosOpen").addEventListener("click", openSOS);

function logCraving(ok){
  S.cravings.push({t: sosData.t, i: sosData.i, trig: sosData.trig, ok});
  if(S.cravings.length > 600) S.cravings = S.cravings.slice(-600);
  S.lastEdit = Date.now(); save();
}

      <button class="btn primary block" type="button" data-lapse="save">Je note et je repars maintenant</button>
      <button class="btn block" type="button" data-lapse="cancel">Annuler</button>
      <button class="btn ember block" type="button" data-lapse="restart">J'ai repris pour de bon : fixer un nouveau jour J</button>
    </div>
  </div>`;
  sos.hidden = false; document.body.style.overflow = "hidden";
}
sos.addEventListener("click", e => {
  const b = e.target.closest("[data-lapse]"); if(!b) return;
  const a = b.dataset.lapse;
  if(a === "save"){ const n = Math.max(1, +document.getElementById("lapseN").value || 1); S.lapses.push({t: now(), n}); closeSOS(); commit(); toast("Noté. Le compteur repart maintenant."); }
  if(a === "cancel") closeSOS();
  if(a === "restart"){ S.quitAt = null; S.lapses = []; closeSOS(); tab = "today"; commit(); toast("Choisissez un nouveau jour J. Chaque tentative rapproche du but."); }
});

/* Mise à jour du compteur chaque minute sans perturber la saisie */
setInterval(() => { renderBand(); if(tab === "today" && S.quitAt && sos.hidden && !document.activeElement.matches("input,textarea")) render(); }, 30000);

/* Le mot « ARRÊTE. » occupe toute la largeur, quelle que soit la police chargée */
function fitWord(){
  const w = document.querySelector(".stopword"); if(!w) return;
  const box = w.parentElement.clientWidth - parseFloat(getComputedStyle(w.parentElement).paddingLeft) - parseFloat(getComputedStyle(w.parentElement).paddingRight);
  w.style.animation = "none"; w.style.letterSpacing = "-.012em"; w.style.fontSize = "100px";
  const size = Math.min(190, Math.max(48, 100 * box / w.scrollWidth * 0.98));
  w.style.fontSize = size + "px"; w.style.letterSpacing = ""; w.style.animation = "";
}
window.addEventListener("resize", fitWord);
fitWord();
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitWord);

render();
initStore();
})();
</script>
